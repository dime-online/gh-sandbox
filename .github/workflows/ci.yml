name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n gh-sandbox
          bash -n tests/run.sh
          bash -n tests/bin/gh
          bash -n completions/gh-sandbox.bash
      - name: Makefile targets
        run: |
          make check
          make test
